note: >-
  Kilden fører flere valgte enn de som står her. Sekretær Kjell Melsæter,
  kasserer Jostein Torset, sportsutvalgsmedlem Asbjørn Hamar, redaktør Finn
  Kvello og medlemmene i gutte-, smågutte- og rekruttutvalgene er ikke tatt inn,
  fordi de ikke har personfil i arkivet og identiteten ikke er avklart mot
  eksisterende navneformer. De står oppført i review-loggen for batchen.
