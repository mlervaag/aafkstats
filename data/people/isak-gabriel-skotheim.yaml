    note: >-
      Klubbmelding 2. september 2026, siste dag i overgangsvinduet: «Skotheim kommer fra en
      sterk sesong i OBOS-ligaen, der han har scoret åtte mål på 18 kamper for Hødd», og han
      «har signert en kontrakt ut 2029». Hødd melder samme dag at «IL Hødd Fotball og
      Aalesunds FK er einige om ein overgang for Isak Gabriel Skotheim»
      (https://www.hodd.no/nyheiter/isak-skotheim-klar-for-aafk). Begge klubbene bekrefter
      altså overgangen. Overgangssummen er ikke oppgitt av noen av dem, og står derfor ikke
      her.
