transfers:
  - id: ut-frigg-1950
    direction: out
    club: Frigg
    clubId: frigg
    date: "1950"
    sources:
      - sourceId: medlemsblad-for-aalesunds-fotb-1950-3b73
        page: "12"
        fields:
          - direction
          - club
          - date
    note: Kilden skriver at han «skal no bo i Oslo i et halvt års tid, for videre
      utdannelse i politiyrket» og at han «er no innmeldt i Frigg, der han vokter
      buret i A-laget». Flyttingen er altså begrunnet i utdanning og omtalt som
      midlertidig. Kilden oppgir høsten, ikke en dag. Samme opplysning står også
      som rollen «overgang-frigg-1950»; den blir stående til den kan fjernes
      gjennom bevaringsunntak.
