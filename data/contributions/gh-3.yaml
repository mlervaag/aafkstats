text: >
  En trofast AaFK-supporter mistet lappen på vei til kamp. Personen som måtte kjøre opp
  igjen var plaget av halsbrann og bestilte en halvliter melk i baren. Vi spilte lenge med
  ti mann fordi Aarøy måtte sy noen sting i hånden etter et uheldig møte med et
  reklameskilt.
