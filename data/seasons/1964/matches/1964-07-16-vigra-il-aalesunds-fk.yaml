report:
  summary: AaFK vant 15-0 over Vigra på Roald og ledet 8-0 ved pause.
  body: Sunnmørsposten omtalte seieren som ny klubbrekord, men skrev bare at den visstnok forbedret en rekord fra 1920-årene. AaFK spilte 4-2-4 og brente et straffespark. Etter omtrent 20 minutter av andre omgang kom det niende målet. Oskar Pedersen ble flyttet fram de siste 20 minuttene og scoret fire, inkludert det 15. målet. Stakkeng scoret fire, Garshol to og Finnes ett. Leif B. Aarø og Bror Johansen nevnes også blant målscorerne, uten sikre individuelle tall. Godo og Sigm. Andersen delte dommeroppgaven.
