note: >
  AaFK, Smart og Rollon spilte dobbel serie. Årboka gir AaFK fire kamper, to
  seire, to tap, 6–6 i mål og fire poeng, og sier uttrykkelig at AaFK ble
  kretsmester. Kontrollregning gir fire poeng og null i målforskjell på alle
  tre lagene; hvordan kretsen skilte dem, står ikke i kilden. Datoene er ikke
  oppgitt.
