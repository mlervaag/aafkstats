id: aafk-medlemsblad
title: AaFK Medlemsblad
sourceType: series
publisher: Aalesunds fotballklubb
description: >
  Klubbens eget medlemsblad, utgitt fra 1950. Utgavene i arkivet er digitalisert av
  Nasjonalbiblioteket og lenket enkeltvis. Bladet er den tetteste samtidige kilden
  arkivet har til kamper, årsmøter og klubbliv i tiårene før nettet.
