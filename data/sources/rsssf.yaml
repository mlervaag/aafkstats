permissionNote: >
  robots.txt stenger bare /cgi-bin/ og /krets/, så selve arkivsidene kan hentes.
  Nettstedet oppgir at privat, ikke-kommersiell kopiering er tillatt med kreditering,
  mens kommersiell bruk krever skriftlig tillatelse. Et offentlig GitHub-arkiv og et
  offentlig nettsted er ikke åpenbart privat bruk, så publisering er ikke avklart.
  Neste steg: be lars@rsssf.no skriftlig om tillatelse til automatisert uthenting og
  offentlig publisering av normaliserte kampfakta med tydelig kreditering og lenke
  tilbake til kildesiden per kamp.
