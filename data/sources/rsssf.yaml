permissionNote: >
  robots.txt stenger bare /cgi-bin/ og /krets/, så selve arkivsidene kan hentes.
  Nettstedet oppgir at privat, ikke-kommersiell kopiering er tillatt med kreditering,
  mens kommersiell bruk krever skriftlig tillatelse. Et offentlig GitHub-arkiv og et
  offentlig nettsted er ikke åpenbart privat bruk, så publisering er ikke avklart.
  Neste steg: be lars@rsssf.no skriftlig om tillatelse til automatisert uthenting og
  offentlig publisering av normaliserte kampfakta med tydelig kreditering og lenke
  tilbake til kildesiden per kamp.
  Prosjekteier besluttet 2026-08-03 å høste herfra: åpent, ikke-kommersielt
  supporterarkiv som registrerer offentlige kampfakta, med kildehenvisning og lenke
  tilbake til kilden fra hver kamp. Ingen artikkeltekst kopieres, ingen
  tilgangskontroll omgås, og kilden avlastes med fartsgrense og hurtiglager.
  Statusen er «accepted_risk» og ikke «granted», siden ingen har gitt uttrykkelig
  tillatelse — arkivet skal si hva det vet, ikke pynte på det.
note: Tabeller og resultater tilbake til 1930-tallet. Ofte eneste kilde for de eldste sesongene.
