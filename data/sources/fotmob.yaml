permissionNote: >
  Udokumentert endepunkt. Vilkårene begrenser automatiserte tjenester og systematisk
  eller regelmessig bruk, og robots.txt blokkerer API-rutene. Ingen tillatelse er
  innhentet.
  Prosjekteier besluttet 2026-08-03 å hente kampfakta herfra likevel, som et
  avgrenset engangsuttrekk for et ikke-kommersielt supporterarkiv: bare fakta, aldri
  artikkeltekst, ingen omgåelse av tilgangskontroll, og fartsgrense mot kilden.
  Statusen er «accepted_risk» og ikke «granted» nettopp fordi det er en beslutning,
  ikke en tillatelse.
note: >
  Uoffisielt og udokumentert JSON-endepunkt. En avgrenset teknisk pilot viser rik
  dekning fra nyere sesonger, men dette er ikke en åpen API-lisens. FotMob skal ikke
  være eneste sannhetskilde, og større eller løpende innhøsting krever rettighetsavklaring.
