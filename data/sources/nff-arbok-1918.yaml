description: >
  Lest manuelt i Nasjonalbiblioteket. NM-diagrammet på trykte sider 100–101
  har feilaktig overskriften «Norgesmesterskapet 1919», men turneringstreet
  ender med Kvik–Brann 4–0 og gjelder mesterskapet i 1918. NFFs moderne
  historikk skiller finalene Kvik–Brann i 1918 og Odd–Frigg i 1919.
