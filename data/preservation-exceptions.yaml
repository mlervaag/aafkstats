# Preservation Exceptions for AaFK-arkivet
#
# Dokumenterte og godkjente unntak fra streng historisk additivitet.
# Hvert unntak må være målrettet mot én konkret entitet og sti, og ha en menneskelesbar begrunnelse.
# Brede wildcards (*, roles/*, etc.) er forbudt.
#
# Planen for en kamp som ikke er spilt (avspark, arena, runde, dommer) trenger
# ikke unntak. Kilden retter terminlista til kampen går, og vernet godtar det
# av seg selv — se OPEN_MATCH_PLAN_FIELDS i
# packages/schema/src/historical/archive-preservation.ts. Unntaket som sto her
# for avsparket til Fredrikstad–AaFK 29. november 2026 (godkjent i PR #262) er
# derfor ryddet bort.
exceptions: []
