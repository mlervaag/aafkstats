notes:
  - >
    Direkte fortsettelse av den manuelle NFF-runden for 1914–1920. Samme
    datamodell, kildeprinsipper og skille mellom kanoniske kamper,
    kildedokumenterte resultater, sesongdata, personobservasjoner og
    forskningsdokumentasjon.
  - >
    Ingen nye kanoniske kamper er opprettet. Ingen av kildene som er lest gir
    dato for de tretti udaterte resultatene, og ingen dato er konstruert.
  - >
    Klasse B er holdt utenfor A-lagets kamp- og sesongstatistikk. To Klasse
    B-funn er bevart som historiske observasjoner om klubbhistorikk.
  - >
    Sidetallene er trykte sidetall der gjennomgangen leste dem av boksiden. For
    NM-diagrammene og regnskapssidene oppgir gjennomgangen bare
    Nasjonalbibliotekets visningsnummer, og det er det tallet som står.
