permissionNote: >
  AaFK-arkivet ba 2026-08-12 Sunnmøre Fotballkrets om tilgang til historiske
  resultatlister, tabeller, kampfakta, årsrapporter, protokoller og annet
  kildemateriale. Prosjektet beskrev uttrykkelig at fakta skulle normaliseres,
  kildeføres og krediteres, og at dokumenter, bilder og lengre tekst ikke skulle
  republiseres uten avtale. Daglig leder Bjørn Oskar Haukeberg svarte samme dag
  ved å vise direkte til kretsens publiserte historiske materiale på fotball.no,
  samt tilby tilgang til ikke-digitaliserte protokoller fra 1927 og senere og
  eldre dommerkort. Tillatelsen her modelleres kun for Sunnmøre Fotballkrets'
  historiske materiale, ikke som generell tillatelse til hele NFF/FIKS.
note: >
  Offisiell primærkilde for sunnmørsk fotballhistorie. Omfatter årsrapporter,
  historiske oversikter, kretsmestere, organisasjon, representasjon, dommere,
  kurs og annet kretsmateriale.
