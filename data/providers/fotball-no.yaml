permissionNote: >
  NFF oppgir at gjenbruk krever avtale og at automatiserte roboter/spiders ikke er
  tillatt. Prosjekteier besluttet 2026-08-05 å hente offentlige kampfakta og tabeller
  herfra for utvalgte sesonger som et avgrenset uttrekk for et ikke-kommersielt
  supporterarkiv: bare fakta, aldri artikkeltekst, med kildehenvisning og lenke
  tilbake til kilden fra hver kamp.
note: >
  Offisiell kilde for terminliste, kampnummer, resultater og sluttabell. Bane og
  00:00-klokkeslett bør kontrolleres før de importeres.

