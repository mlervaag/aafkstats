id: 1959-aldersbestemte-lag
title: Fire lagtitler i de aldersbestemte klassene i 1959
text: >
  Årsberetningen for 1959 oppsummerte en sterk sesong for klubbens yngre lag:
  juniorlaget ble kretsmester for andre år på rad, rekruttlaget sikret seg
  årets kretsmesterskap, guttelaget vant sin avdeling i Ålesundspuljen, og
  reservelaget vant den private reservelagsserien.
date: "1959"
seasonYears:
  - 1959
