id: 1961-kramyra-klubbhus-innvielse
title: Innvielse av det nye klubbhuset på Kråmyra
text: Klubbhuset på Kråmyra, reist til en kostnad av ca. 110 000 kr, ble festlig innviet 18. februar 1961. Stor innsats fra byggekomiteen, styret og Dameavdelingen.
