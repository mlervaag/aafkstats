id: 1960-kramyra-klubbhus-fullfort
title: Fullføring av Kråmyra klubbhus og årsmøte i eget hus
text: Klubbhusets annet byggetrinn (storsalen og overetasjen) på Kråmyra ble fullført høsten 1960 til en samlet anleggsverdi over 100 000 kr. Klubbens årsmøte 25. november 1960 ble for første gang i klubbens historie avholdt i eget klubbhus.
