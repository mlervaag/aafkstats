id: eck-olsen-1922-finalested-og-landskamper
title: Anbefalte Trondhjem som finalested
text: >
  I debatten om neste års mesterskapsfinale sluttet Eck Olsen seg i stor grad til
  Odd, men anbefalte Trondhjem som finalested. Han mente samtidig at landskamper
  ikke burde legges utenfor Østlandet, og at de burde legges til Kristiania fordi
  publikumspotensialet var større der.
