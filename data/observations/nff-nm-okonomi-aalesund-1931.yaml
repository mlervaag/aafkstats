id: nff-nm-okonomi-aalesund-1931
title: NFFs arrangementsregnskap for Aalesund–Ny-Solheim i NM 1931
text: >
  Kampregnskapet for første NM-runde fører Aalesund–Ny-Solheim med 1 050
  betalende tilskuere, 911 kroner i bruttoinntekt og 56,50 kroner i provisjon
  til arrangøren. Tabellen oppgir et nettotap for forbundet på 841,55 kroner.
  Det er et arrangementsregnskap for mesterskapet, ikke et AaFK-regnskap.
date: "1931"
seasonYears: [1931]
