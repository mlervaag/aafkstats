id: nff-arbok-1932-klubbhistorikk
title: Kretsmester i Klasse A i 1932
text: >
  Årboka erklærer AaFK kretsmester i Klasse A etter 3–3 og 5–0 mot Rollon.
  Klasse B-resultatene var 3–9 mot Langevåg, 3–3 mot Sykkylven, 4–5 mot Hødd
  og 0–2 mot Rollon. Klasse B er ikke lagt i A-lagsstatistikken.
