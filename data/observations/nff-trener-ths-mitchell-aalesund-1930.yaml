id: nff-trener-ths-mitchell-aalesund-1930
title: NFFs trener Ths. Mitchell arbeidet i Aalesund i 1930
text: >
  NFFs beretning oppgir at trener Ths. Mitchell arbeidet i Skien, Aalesund,
  Mjøndalen og Strømsgodset og dessuten assisterte ved landskamper. Årboka
  knytter arbeidet til byen Aalesund, men sier ikke uttrykkelig hvilken klubb
  han trente. Observasjonen er derfor ikke gjort til et AaFK-verv.
date: "1930"
seasonYears: [1930]
