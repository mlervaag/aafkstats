id: nff-nm-okonomi-aalesund-1930
title: NFFs arrangementsregnskap for fire AaFK-kamper i NM 1930
text: >
  NFFs kampregnskap fører Kristiansund–Aalesund med 1 522 betalende og
  1 165,75 kroner brutto, Aalesund–Skeid med 1 718 og 2 202 kroner,
  Aalesund–Selbak med 2 506 og 2 711 kroner, og Ørn–Aalesund med 2 185 og
  2 719,50 kroner. Tabellene viser nettotap for forbundet på henholdsvis
  63,16, 426,41, 268,84 og 682,98 kroner. Dette er NFFs arrangementsregnskap,
  ikke AaFKs klubbregnskap.
date: "1930"
seasonYears: [1930]
