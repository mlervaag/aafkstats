id: aafk-protest-adamson-ljungquist-1917
title: Ny protest om Adamson og Ljungquist var under behandling
text: >
  AaFK protesterte på Hugo Adamsons og Ljungquists spillerberettigelse i en kretskamp 8. juli. Saken var fortsatt
  under behandling da årsberetningen ble trykt.
date: "1917"
seasonYears: [1917]
