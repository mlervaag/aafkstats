id: nff-banelan-aafk-1921
title: Sto med 8 000 kroner i banelån hos NFF
text: >
  Norges Fotballforbunds status per 1. juli 1921 fører «Aalesund» med 8 000
  kroner under Aktiva, Debitorer, Banelaan.
date: "1921"
seasonYears: [1921]
sources:
  - sourceId: nff-arbok-1921
    page: "51"
    fields: []
note: >
  Kilden dokumenterer beløpet og betegnelsen «Aalesund». Den sier ingenting om
  lånevilkår, hva lånet finansierte eller hvem som var juridisk låntaker.
