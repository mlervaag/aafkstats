id: nff-banefond-aafk-1933
title: AaFK fikk nytt lån fra NFFs Banefond i 1933
text: >
  Banefondskomiteens beretning oppgir Aalesunds Fotballklubb blant mottakerne
  av nye lån siden forrige beretning. Banefondets regnskap fører klubben som
  aktiv låntaker med 750 kroner. Beløpet er visuelt kontrollert i tabellen.
  Kilden sier ikke hva anlegget eller lånevilkårene var, og posten er derfor
  ikke tolket videre.
date: "1933"
seasonYears: [1933]
