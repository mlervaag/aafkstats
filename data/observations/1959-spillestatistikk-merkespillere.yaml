id: 1959-spillestatistikk-merkespillere
title: Klubbens spillestatistikk 1959 — 8 gull- og 11 sølvmerkespillere
text: >
  Medlemsbladet trykte i 1959 klubbens samlede spillestatistikk for A-laget, med
  62 navngitte spillere og antall A-kamper for hver. Karsten Nedregård står
  øverst med 313 kamper, foran Trygve Olsen 260, Edvin Løvold 220, Lauritz
  Gaaseide 213, Reidar Skarbøvik 207 og Jørgen Hollevik, Øivind Haagensen og
  Konrad Korsnes med 200 hver. Deretter følger Bernt Sulebust 196, Thorbjørn
  Aarø 193, Finn Tolaas 170, Asbjørn Korsnes 154, Karl Løvold 153, Johan Refsnes
  og Einar Helseth 152, Einar Aas 144, Asbjørn Ystenes 136, Olav Skarbøvik 130,
  Sverre Otterlei og Jan Larsen 128, Karsten Vadseth 124 og Mindor Sunde 122.
  Ingen spillemerker ble delt ut for sesongen 1958, fordi ingen spiller fylte
  kravene. Kilden opplyser selv at statistikken ikke er ajourført, og at flere
  spillere fra tidligere tid har fylt kravene til både sølv og gull uten å være
  registrert med en eneste kamp.
