id: nff-arbok-1935-klubbhistorikk
title: Sunnmøre Fotballkrets 1935
text: >
  Årboka fører Ålesunds Fotballklubb som kretsmester i Klasse A, B og C.
  Klasse A-tabellen gjengir fire AaFK-resultater og to øvrige kretskamper.
  Klasse B og C er bare mesterskapsoppføringer uten AaFK-resultatlinjer og
  holdes utenfor A-lagsstatistikken.
date: "1935"
seasonYears: [1935]
