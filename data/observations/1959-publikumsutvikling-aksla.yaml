id: 1959-publikumsutvikling-aksla
title: Publikumsutviklingen og rekorden på Aksla stadion
text: >
  Årsberetningen for 1959 slo fast at publikumsbesøket hadde gått tilbake siden
  1951, men at 1959 snudde trenden med 2 190 flere tilskuere enn året før.
  Publikumsrekorden på Aksla stadion sto fortsatt på 7 700 tilskuere, satt i en
  kamp mot Skeid i 1953.
