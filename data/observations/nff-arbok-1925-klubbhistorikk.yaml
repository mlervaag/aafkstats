id: nff-arbok-1925-klubbhistorikk
title: Kretsmesterskap og Klasse B-funn i 1925
text: >
  Årboka erklærer AaFK kretsmester i Klasse A med seks poeng etter 1–2 og 4–2
  mot Rollon og 3–0 og 6–0 mot Hødd. Klasse B ble også kretsmester: 0–0 og
  2–1 mot Rollon, 3–1 mot Langevåg, mens Hødd trakk seg uten oppgitt resultat.
  AaFK står dessuten som vinner av Fabrikeier Brynes pokal i Klasse A og Møre
  distrikts pokal i Klasse B. Klasse B er ikke lagt i A-lagsstatistikken.
