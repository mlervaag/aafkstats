id: nff-nm-vannforesaken-aalesund-1935
title: Innsamling i Ålesund under NM 1935
text: >
  NFF-årboka oppgir at kampene i tredje NM-runde i Ålesund innbrakte
  524,25 kroner til «vannføresaken». Beløpet dokumenterer en lokal innsamling
  ved arrangementet, ikke inntekt i AaFKs eget regnskap.
date: "1935"
seasonYears: [1935]
