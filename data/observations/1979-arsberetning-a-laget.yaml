id: 1979-arsberetning-a-laget
title: Årsberetningen for 1979 — nedrykk, 41 kamper og to 200-kampsjubilanter
text: >
  Årsberetningen for A-laget 1979, undertegnet i Ålesund 24. november 1979, gjør
  opp en sesong der AaFK rykket ned fra 2. divisjon. Laget spilte 41 kamper i
  alt: 22 seriekamper, én NM-kamp, én tippekamp og resten private kamper og
  treningskamper. I serien endte det med 13 poeng, 9 uavgjorte, 2 seire og 11
  tap, og en målscore på 15–24. De private kampene og treningskampene ga 42–23
  på sytten kamper. Totalt målregnskap for året var 59–51.
  Sesongen begynte med treningskamp mot Molde 24. februar på glatt og vanskelig
  bane, tapt 1–6, og NM-eventyret endte allerede i 1. runde 31. mai med 0–1 mot
  Skarbøvik på Kråmyra. Klubben gjennomførte en kombinert trenings- og
  familieleir i Moelv 15.–22. juli.
  Torgeir Skauvik spilte flest kamper med 36, foran Terje Eriksen, Eivin Syversen
  og Arne Grønvik med 35. Arne Grønvik ble toppscorer med 9 mål. I løpet av
  sesongen passerte Leif Nærø og Bjørn Hatlø 200 kamper for AaFK, Helge Nøstdahl
  passerte 150, og Bjørn Andersen og Nils Skuggen passerte 100. Leif Nærø ble
  kåret til årets spiller og fikk en sølvpokal oppsatt av Fiskernes Bank.
