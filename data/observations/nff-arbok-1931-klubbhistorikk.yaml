id: nff-arbok-1931-klubbhistorikk
title: Kretsmester og to pokaler til odel og eie i 1931
text: >
  AaFK ble kretsmester i Klasse A og vant Klasse A-pokalen for tredje gang,
  «til odel og eie». Klasse B-pokalen ble også vunnet for tredje gang og til
  odel og eie etter 4–4 og 4–1 i omkamp mot Langevåg samt 2–1 mot Hødd.
  Klasse B-serien ga tapene 2–7 mot Hødd, 0–3 mot Langevåg og 0–7 mot Rollon.
  Klasse B er ikke A-lagsdata.
date: "1931"
