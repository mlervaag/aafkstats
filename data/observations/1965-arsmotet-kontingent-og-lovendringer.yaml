id: 1965-arsmotet-kontingent-og-lovendringer
title: Årsmøtet 1965 hevet kontingenten og la lagkapteinsvalget til sportsutvalget
text: >-
  På det ordinære årsmøtet i møtesalen i Klubbhuset på Kråmyra søndag 21. november
  1965 møtte om lag 80 stemmeberettigede, og forhandlingene varte i rundt fire og
  en halv time. Av tre framlagte lovforslag ble to vedtatt: kontingenten for voksne
  medlemmer ble hevet fra 10 til 20 kroner og for juniorer og gutter fra 2 til 5
  kroner, med livsvarig medlemskap satt til ti ganger årskontingenten, og
  sportsutvalget fikk myndighet til å velge lagkaptein for hver enkelt kamp. Et
  forslag om å dele oppmannsvervet i en A- og en B-oppmann fikk ikke nødvendig
  flertall. Trenerspørsmålet for 1966 sto uavklart fordi den aktuelle kandidaten
  falt fra i siste øyeblikk, og det ble besluttet å innkalle til ekstraordinær
  generalforsamling.
