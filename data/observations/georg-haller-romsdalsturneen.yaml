id: georg-haller-romsdalsturneen
title: NFF takket Haller for arbeidet med Romsdalsturneen
text: >
  Norges Fotballforbund omtaler Geo Haller, Aalesunds Fotballklub, som stifter
  og formann i Romsdalske krets og gir ham en særskilt takk for arbeidet med å
  realisere Romsdalsturneen.
personIds: [georg-haller]
sources:
  - sourceId: nff-arbok-1914-1915
    page: "24"
note: >
  Kilden dokumenterer Hallers rolle i Romsdalske krets. Den brukes ikke som
  dokumentasjon på et formannsverv i AaFK.
