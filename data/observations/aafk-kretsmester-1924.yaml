id: aafk-kretsmester-1924
title: Ble kretsmester i Søndmøre kreds, Klasse A
text: >
  Årboka avslutter Klasse A-oppsettet med «Kredsmester: Aalesund fotballklub.»
  AaFK vant begge de spilte kampene, 14–0 mot Langevaag fotballkl. og 7–1 mot
  Hødd, Ulsteinvik.
date: "1924"
seasonYears: [1924]
competitionIds: [sondmore-kreds-klasse-a]
