id: 1959-sommercupen
title: AaFK vant Herds sommercup for første gang
text: >
  AaFK vant Herds sommercup i 1959, første gang siden turneringen ble innført
  fire år tidligere. Laget slo Spjelkavik og Skarbøvik på veien til finalen, der
  Herd ble beseiret.
