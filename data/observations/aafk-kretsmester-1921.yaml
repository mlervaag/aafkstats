title: Ble kretsmester i Søndmøre kreds, Klasse A
text: >
  AaFK vant begge kampene mot Rollon og står i årboka som «Kredsmester
  Aalesunds Fotballklub med 4 ptc.» Klubben hadde 5–3 i mål.
