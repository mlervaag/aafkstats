id: 1959-hagbart-benneche-minneord
title: Minneord over Hagbart Benneche
text: >
  Medlemsbladet skrev minneord over tannlege Hagbart Benneche, kalt «Bosse»,
  født og oppvokst i Ålesund og utdannet i Tyskland i 1919. Han spilte på AaFKs
  omtalte lag fra mellomkrigstiden og var med på flere kretsmesterskap i
  A-klassen. Han døde 57 år gammel på Rikshospitalet i Oslo, og årsmøtet hedret
  ham med ett minutts stillhet.
