id: eck-olsen-1922-distriktslag-og-saerkrets
title: Mente ingen klubb burde tvinges inn i en særkrets
text: >
  Eck Olsen mente at distriktslaget burde komme på vidda, og at man ikke burde
  kunne tvinge en klubb inn i en særkrets. Han støttet sterkt gjenvalg av
  presidenten.
