id: 1965-arets-aafk-spiller-jarle-kleive
title: Jarle Kleive kåret til årets AaFK-spiller 1965
text: >-
  Medlemsbladets jury kåret Jarle Kleive til årets AaFK-spiller for 1965, foran
  Steinar Nedregård på andreplass og Harald «Bror» Johansen på tredje. Kleive
  spilte 34 av lagets 36 kamper i 1965 og var sammen med Nedregård og Leif Bugge
  Aarøe med på kretslaget som slo Skeid 2–1.
