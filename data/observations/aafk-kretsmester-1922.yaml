id: aafk-kretsmester-1922
title: Ble kretsmester i Søndmøre kreds, Klasse A
text: >
  Årboka avslutter Klasse A-oppsettet med «Kredsmester: Aalesunds fotballklub.»
  AaFK spilte fire kamper, vant to og tapte to, med 6–6 i mål og fire poeng.
date: "1922"
seasonYears: [1922]
competitionIds: [sondmore-kreds-klasse-a]
sources:
  - sourceId: nff-arbok-1922
    page: "95"
    fields: []
note: >
  Kontrollregning av de seks kampene gir fire poeng og null i målforskjell på
  alle tre lagene: AaFK 6–6, Smart 11–11 og Rollon 10–10. Årboka sier likevel
  uttrykkelig at AaFK ble kretsmester, og oppgir ikke hvilken regel som skilte
  lagene.
