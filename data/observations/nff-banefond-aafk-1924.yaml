id: nff-banefond-aafk-1924
title: Ikke lenger oppført blant Banefondets låntakere
text: >
  Aalesund står ikke lenger oppført blant Banefondets låntakere i Norges
  Fotballforbunds regnskap per 30. september 1924. Listen omfatter blant andre
  Hafslund, Aassidens Idrætsforening, Storms Ballklub, Brages Stadion, Fram,
  Odd, Fredrikstad Stadion, Sarpsborg, Sandefjord, Gjøvik T. & I. F., Larvik
  T. & I. F. og Realbanken.
date: "1924"
seasonYears: [1924]
sources:
  - sourceId: nff-arbok-1924
    page: "33"
    fields: []
note: >
  Regnskapet gjelder 1. juli 1923 til 30. september 1924. Fraværet fra listen er
  det kilden dokumenterer. Den sier ikke at lånet var fullt nedbetalt, ettergitt
  eller avsluttet på en bestemt dato.
