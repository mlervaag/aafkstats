id: aafk-more-distriktslagspokal-1924
title: Vant pokalkampene i Klasse A
text: >
  Årboka fører «Seierherre: Aalesund fotballklub» i pokalkampene i Klasse A,
  etter 4–1 mot Hødd og 7–5 mot Rollon etter forlenget spilletid.
