id: 1951-kramyra-nff-lan
title: NFF-lån på kr 20 000 og kjørbar vei til Kråmyra
text: På et ekstraordinært årsmøte 23. juli 1951 vedtok AaFK enstemmig å endre
  lovens § 9 og gi styret fullmakt til å ta opp et lån på kr 20 000 fra Norges
  Fotballforbund for å sikre ferdigstillelsen av treningsbanen på Kråmyra.
  Gjennom 1951 ble veien opp til Kråmyra ferdigstilt og gjort kjørbar, det ble
  ytet ca. 1500 dugnadstimer, kran ble innkjøpt, og 4000 kr ble tildelt fra
  tippemidlene.
