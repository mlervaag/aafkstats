id: nff-arbok-1933-klubbhistorikk
title: Klasse C-kretsmester og Klasse B-funn i 1933
text: >
  Rollon står som kretsmester i Klasse A. AaFKs Klasse B-resultater omfatter
  3–1 mot Langevåg, 1–2 mot Guard, walkover-tap mot Sykkylven, 6–1 mot Volda
  og 1–4 mot Hødd. I Klasse C vant AaFK 3–1 mot Volda, 5–2 mot Iris og finalen
  1–0 mot Rollon og ble kretsmester. Klasse B og C er ikke A-lagsdata.
date: "1933"
