id: aafk-more-distriktslagspokal-1921
title: Vant Møre Distriktslag for Idræts vandrepokal
text: >
  Årboka fører AaFK som «Vinder av pokalen i 1921» i Klasse A, etter 3–2 mot
  Hødd og 4–1 mot Braat. Finalen er ført som «Braatt Aalesund fotballklub,
  Kr.sund N. 0 4».
date: "1921"
seasonYears: [1921]
competitionIds: [more-distriktslagspokal]
sources:
  - sourceId: nff-arbok-1921
    page: "112-113"
    fields: []
note: >
  Årboka fører både 4–1 mot Braat på trykt side 112 og 0–4 i finalen på trykt
  side 113. Oppgjørene er bevart hver for seg slik kilden presenterer dem.
