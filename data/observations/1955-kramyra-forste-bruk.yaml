id: 1955-kramyra-forste-bruk
title: Første gangs bruk av Kråmyra treningsbane
text: Søndag 21. august 1955 ble en merkedag i AaFKs historie da gresstreningsbanen på Kråmyra for første gang ble tatt i bruk etter fullføringen av banens første byggetrinn under ledelse av banekomiteens formann Emil Sandø.
