id: 1961-georg-haller-dod
title: Klubbens stifter Georg Haller er død
text: Minneord over klubbens stifter og første formann Georg Haller, som gikk bort 25. februar 1961. Han stiftet AaFK i 1914 og satte dype spor i klubbens historie.
