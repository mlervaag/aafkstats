id: eck-olsen-1922-fjerde-runde-i-alesund
title: Forsvarte at fjerde runde ble lagt til Ålesund
text: >
  Eck Olsen imøtegikk Larvik-representantens kritikk av fjerde runde. Han sa at
  Aalesund var svært takknemlig for at kampen var lagt dit, og at det var
  vanskelig for Aalesund å få utenbys klubber på besøk selv når reisen ble
  betalt, fordi tidsbruken ved reisen spilte en stor rolle.
date: 1922-10-14
personIds: [rasmus-eck-olsen]
seasonYears: [1922]
