id: nff-instruksjonsgaranti-aalesund-1928
title: Aalesund fikk garanti for profesjonelt instruksjonsbesøk i 1928
text: >
  NFFs beretning om profesjonelle klubbers instruksjonskamper oppgir Aalesund
  blant stedene som fikk garanti. Garantiene som faktisk kom til utbetaling,
  deriblant Aalesunds, utgjorde samlet 3 229,10 kroner. Årboka oppgir ikke
  Aalesunds individuelle andel, og totalbeløpet er derfor ikke tillagt klubben.
date: "1928"
seasonYears: [1928]
