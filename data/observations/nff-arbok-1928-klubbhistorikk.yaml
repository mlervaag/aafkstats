id: nff-arbok-1928-klubbhistorikk
title: Kretsmester i Klasse A og pokalvinner i Klasse B i 1928
text: >
  AaFK ble kretsmester i Klasse A etter 3–2 og 4–2 mot Rollon; Hødd trakk seg.
  Klasse B ga 1–2 mot Langevåg, 3–2 mot Volda og 1–5 mot Rollon. I Klasse
  B-pokalen vant AaFK 8–1 mot Sykkylven, 5–0 mot Langevåg og 4–0 mot Rollon og
  ble seierherre. Klasse B er ikke lagt i A-lagsstatistikken.
date: "1928"
