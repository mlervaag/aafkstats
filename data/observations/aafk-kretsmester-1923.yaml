id: aafk-kretsmester-1923
title: Ble kretsmester i Søndmøre kreds, Klasse A
text: >
  Årboka avslutter Klasse A-oppsettet med «Kredsmester: Aalesunds Fotballklub.»
  AaFK spilte fem kamper med resultat, vant fire og spilte én uavgjort, med
  19–4 i mål og ni poeng.
date: "1923"
seasonYears: [1923]
