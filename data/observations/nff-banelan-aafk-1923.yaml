id: nff-banelan-aafk-1923
title: Sto med 4 000 kroner i banelån hos NFF
text: >
  Norges Fotballforbunds balansekonto per 1. juli 1923 fører «Aalesund» med
  4 000 kroner under Banefondets laantagere.
date: "1923"
seasonYears: [1923]
sources:
  - sourceId: nff-arbok-1923
    page: "49"
    fields: []
note: >
  Sammen med 1921 og 1922 gir dette rekken 8 000, 6 000 og 4 000 kroner. Det er
  en observasjon av tre balansedager, ikke et bevis for lånevilkår eller en
  avtalt nedbetalingsplan.
