id: eck-olsen-1922-loddtrekningsordningen
title: Ville prøve den nye loddtrekningsordningen i ett år
text: >
  Eck Olsen talte mot at en ny loddtrekningsordning skulle gjelde i to år. Han
  mente den burde prøves i ett år.
