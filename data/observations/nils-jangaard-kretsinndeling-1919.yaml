id: nils-jangaard-kretsinndeling-1919
title: Deltok i behandlingen av kretsinndelingen
text: >
  I behandlingen av en skrivelse fra Aalesunds Fotballklub om deling av
  Romsdalske krets uttalte Nils Jangaard, Aalesund, at full deling ikke lot seg
  gjennomføre på dette tidspunktet. Han opprettholdt forslaget om to
  underkretser. En ordning med to underkretser ble senere enstemmig vedtatt.
