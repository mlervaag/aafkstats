id: nff-banelan-aafk-1920
title: NFF ga AaFK banelån på 10 000 kroner
text: >
  Norges Fotballforbund hadde disponert 10 000 kroner som banelån til Aalesunds Fotballklub. Første årsavdrag på
  2 000 kroner var betalt, og NFFs status per 1. september 1920 førte klubben med 8 000 kroner i utestående beløp.
date: "1920-09-01"
seasonYears: [1920]
sources:
  - sourceId: nff-arbok-1920
    page: "40, 42"
note: Kilden knytter ikke lånet til en bestemt bane.
