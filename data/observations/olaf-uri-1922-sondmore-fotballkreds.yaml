id: olaf-uri-1922-sondmore-fotballkreds
title: Olaf Uri representerte Søndmøre Fotballkreds på forbundstinget
text: >
  Representantlisten for forbundstinget i Bergen 14. oktober 1922 fører Olaf Uri
  for Søndmøre Fotballkreds.
date: 1922-10-14
seasonYears: [1922]
sources:
  - sourceId: nff-arbok-1922
    page: "43"
    fields: []
note: >
  Uri møtte for kretsen, ikke for AaFK, og er derfor ikke opprettet som person i
  arkivet.
