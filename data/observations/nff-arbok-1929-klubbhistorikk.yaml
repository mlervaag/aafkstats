id: nff-arbok-1929-klubbhistorikk
title: Kretsmester i Klasse A og pokalvinner i Klasse B i 1929
text: >
  Årboka erklærer AaFK kretsmester i Klasse A etter en avgjørende omkamp mot
  Rollon som endte 6–2. Klasse B fikk tre oppgjør uten score fordi Sykkylven,
  Langevåg og Volda trakk seg, og tapte 0–2 mot Hødd og 1–2 mot Rollon. I
  Klasse B-pokalen vant AaFK 6–1 mot Sykkylven og 4–3 mot Rollon. Klasse B er
  ikke A-lagsdata.
date: "1929"
seasonYears: [1929]
