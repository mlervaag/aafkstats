title: AaFK ble Norgesmester i 2009
text: Sunnmøre Fotballkrets' årsrapport beskriver AaFKs historiske cupfinaleseier mot Molde på Ullevaal 8. november 2009. Finalen startet klokken 13.15, og godt over 10 000 sunnmøringer var til stede.
