id: forbundstinget-1922-aafk-representanter
title: R. Eck Olsen og Edvard Skudvig møtte for AaFK på forbundstinget
text: >
  Representantlisten for forbundstinget i Bergen 14. oktober 1922 fører R. Eck
  Olsen og Edvard Skudvig for Aalesund Fotballklub. Olaf Uri møtte for Søndmøre
  Fotballkreds.
date: 1922-10-14
personIds: [rasmus-eck-olsen, edvard-skugvik]
seasonYears: [1922]
sources:
  - sourceId: nff-arbok-1922
    page: "43"
    fields: []
note: >
  Kilden dokumenterer at de to møtte for klubben. Den sier ikke at de hadde et
  bestemt verv i AaFK. Olaf Uri er ikke opprettet som person: årboka knytter ham
  til kretsen, ikke til klubben.
