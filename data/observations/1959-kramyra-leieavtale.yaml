id: 1959-kramyra-leieavtale
title: Leieavtalen om Kråmyra
text: >
  Medlemsbladet gjorde i 1959 rede for avtalen med Ålesund kommune om
  Kråmyra-anlegget. Klubben fikk 60 000 kroner av en anslått kostnad på 80 000
  kroner, drenering innberegnet, mens Rollon fikk 35 000 av 45 000 til sitt
  anlegg. Kommunen betalte 8 000 kroner i årlig leie, hvorav 6 000 gikk til
  avdrag på lånet. Banen ble stilt gratis til disposisjon onsdager og fredager,
  mens lørdagskamper kostet 20 kroner i leie.
