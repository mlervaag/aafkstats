id: rasmus-eck-olsen-forbundstinget-1928
title: Eck Olsen om avstand, konkurranse, banefond og banekrav i 1928
text: >
  Som AaFK-representant argumenterte R. Eck Olsen for at ligaopptatte
  østlandsklubber fortsatt måtte besøke klubber langt unna; spurte om en
  tapskonto i Banefondet fordi lånesøkere hadde stilt garanti; kommenterte
  Møres geografiske plassering; og hevdet at en klubb måtte kunne spille en
  kretskamp på for liten bane under protest. Navnesøk gjennom hele referatet
  fant også korte innlegg om årsberetningen, varslingsfrister og finalested.
