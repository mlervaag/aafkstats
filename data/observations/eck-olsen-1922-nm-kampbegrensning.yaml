id: eck-olsen-1922-nm-kampbegrensning
title: Mente forslaget om å begrense antall NM-kamper var overflødig
text: >
  I debatten på forbundstinget i 1922 mente Eck Olsen, Aalesund, at et forslag
  om å begrense antall mesterskapskamper per klubb var overflødig. Ramm sa seg
  enig med Eck Olsen og Mjelva i saken.
