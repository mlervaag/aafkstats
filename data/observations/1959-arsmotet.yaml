id: 1959-arsmotet
title: Årsmøtet 1959 og styrets arbeidsår
text: >
  Årsmøtet i 1959 ble holdt i Maskinistforeningens lokale fredag 27. november
  klokken 19. Styret hadde da avholdt 18 styremøter og behandlet 104 større og
  mindre saker i året som gikk, og det var i tillegg holdt et ekstraordinært
  årsmøte. Hans Henriksen ble valgt til formann. Års- og jubileumsfesten ble
  holdt i Frimurerlosjen lørdag 14. november.
date: 1959-11-27
