id: eck-olsen-1922-presisering-om-sam-knutzen
title: Presiserte at han ikke hadde betvilt Sam. Knutzens gode vilje
text: >
  Eck Olsen presiserte at han ikke hadde betvilt Sam. Knutzens gode vilje, og
  beklaget om han var blitt misforstått. Han hadde siktet til Knutzens stilling
  til amatørreglene.
