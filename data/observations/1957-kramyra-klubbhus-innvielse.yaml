id: 1957-kramyra-klubbhus-innvielse
title: Innvielse av Kråmyra klubbhus (første byggetrinn)
text: Klubbhusets første byggetrinn på Kråmyra ble festlig innviet 26. oktober 1957. Bygget representerer en verdi på ca. 30 000 kr og ble reist etter over 6 000 dugnadstimer under ledelse av banekomiteens formann Rolf Annaniassen og formann Hans J. Henriksen.
