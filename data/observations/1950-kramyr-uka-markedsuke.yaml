id: 1950-kramyr-uka-markedsuke
title: Kråmyr-uka og markedsuka «Å, for en kveld» i Arbeiderforeningen
text: Fra 11. til 19. november 1950 arrangerte AaFK Kråmyr-uka med markedsuken «Å, for en kveld» i Arbeiderforeningen til inntekt for opparbeidelsen av Kråmyra treningsbane. Dameavdelingen, Hovedstyret og Banekomiteen la ned hundrevis av dugnadstimer og samlet inn store midler til anleggsarbeidet.
