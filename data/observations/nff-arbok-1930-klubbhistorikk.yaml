id: nff-arbok-1930-klubbhistorikk
title: Klasse A-pokal og Klasse B-kretsmesterskap i 1930
text: >
  AaFK vant Klasse A-pokalen etter 3–2 mot Rollon; Langevåg trakk seg uten
  resultat. Klasse B ble kretsmester etter 8–1 mot Hødd, 2–2 mot Langevåg,
  8–3 mot Sykkylven og 5–1 mot Rollon. Klasse B-pokalen ga et scoreløst
  walkover-funn mot Langevåg og 1–3 mot Rollon. Klasse B er ikke A-lagsdata.
date: "1930"
