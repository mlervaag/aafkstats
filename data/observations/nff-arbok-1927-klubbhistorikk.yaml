id: nff-arbok-1927-klubbhistorikk
title: Dobbelt kretsmesterskap og doble pokalseire i 1927
text: >
  Årboka erklærer AaFK kretsmester i både Klasse A og Klasse B og vinner av
  begge klassepokalene. Klasse B-resultatene var 3–2 mot Langevåg, 5–1 mot
  Hødd og 5–1 mot Rollon. I Klasse B-pokalen står 7–3 mot Langevåg og 5–1 mot
  Rollon; Hødd trakk seg fra finalen. Klasse B er bevart utenfor A-lagsdata.
date: "1927"
seasonYears: [1927]
