id: nff-arbok-1926-klubbhistorikk
title: Klasse B-kretsmester og pokalvinner i Klasse A i 1926
text: >
  Rollon ble kretsmester i Klasse A etter omkampen 4–3 mot AaFK. AaFK vant
  derimot Klasse A-pokalen etter 4–2 mot Hødd og 4–1 mot Rollon. Klasse B ble
  kretsmester etter 5–1 mot Rollon, 4–3 mot Langevåg og 10–2 mot Volda; Hødd
  trakk seg uten resultat. Klasse B-pokalen omfatter 3–2 mot Langevåg, mens
  Rollon og Hødd trakk seg uten score. Klasse B er ikke A-lagsdata.
date: "1926"
