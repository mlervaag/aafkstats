id: 1950-kramyra-forste-spadestikk
title: Første spadestikk og første sprengladning på Kråmyra treningsbane
text: Onsdag 24. mai 1950 ble det første spadestikket tatt på Kråmyra treningsbane etter at klubben sikret seg 23 mål tomt. Torsdag 1. juni 1950 klokken 18.00 gikk den første sprengladningen (salveskuddet) av under ledelse av banekomiteens formann Emil Sandø.
