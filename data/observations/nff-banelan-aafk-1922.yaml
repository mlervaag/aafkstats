id: nff-banelan-aafk-1922
title: Sto med 6 000 kroner i banelån hos NFF
text: >
  Norges Fotballforbunds balansekonto per 1. juli 1922 fører «Aalesund» med
  6 000 kroner under Debitorer, Banelaan. Året før sto beløpet i 8 000 kroner.
date: "1922"
seasonYears: [1922]
sources:
