id: nff-mesterskapsreiser-more-1934
title: NFF om gressbane, reiser og cupoppsett for Ålesund og Møre i 1934
text: >
  Tingreferatet brukte Ålesund som eksempel på at en hjemmekamp måtte spilles
  på grus fordi Møre manglet gressbane. I debatten om de første NM-rundene ble
  det påpekt at Møre-klubbene allerede møttes gjentatte ganger i Mørebyenes
  liga. Presidenten anslo en reise fra Østlandet til Ålesund eller Kristiansund
  til 1 500–1 600 kroner og forklarte at økonomi styrte oppsettet. Dette er
  debattutsagn og kostnadsanslag, ikke et AaFK-regnskap.
date: "1934"
