id: nff-arbok-1934-klubbhistorikk
title: Kretsmester i Klasse A og Klasse C i 1934
text: >
  Årboka erklærer AaFK kretsmester i Klasse A etter 2–2 og 3–2 mot Rollon og
  4–3 og 4–1 mot Guard. Den fører også AaFK som kretsmester i Klasse C, men
  oppgir ikke de enkelte Klasse C-resultatene. Klasse C er ikke A-lagsdata.
date: "1934"
seasonYears: [1934]
