id: fremad-protest-p-mogstad-1919
title: Fremads protest på bruken av P. Mogstad ble forkastet
text: >
  Fremad protesterte på at P. Mogstad spilte for AaFK i første NM-runde mellom Aalesund og Fremad i Aalesund. NFF
  vurderte bruken som lovlig etter regelverket, forkastet protesten og lot protestgebyret tilfalle forbundskassen.
date: "1919"
seasonYears: [1919]
competitionIds: [nm]
sources:
  - sourceId: nff-arbok-1919
    page: "27"
note: Kilden gir ikke grunnlag for å knytte P. Mogstad til en kanonisk person.
