id: aafk-protest-adamson-1917
title: Fikk medhold i protest om Hugo Adamson
text: >
  Forbundsstyret behandlet 22. august AaFKs protest mot Rollons bruk av Hugo Adamson. NFF vurderte Adamson som ikke
  spilleberettiget, tok protesten til følge og tilbakebetalte protestgebyret på 50 kroner.
date: "1917-08-22"
seasonYears: [1917]
