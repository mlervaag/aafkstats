id: 1946-dameavdelingen-stiftelse
title: Stiftelsen av AaFKs Dameavdeling
text: Torsdag 21. mars 1946 ble AaFKs Dameavdeling stiftet med Irma Berger Huseby (senere Ingebrigtsen) som første formann (1946–1948), etterfulgt av Mary Vegsund (1948–1950) og Alfhild Ringdal (fra 1950). Dameavdelingen har stått for en avgjørende innsats for klubbens økonomi, drakter og Kråmyra-anlegget.
