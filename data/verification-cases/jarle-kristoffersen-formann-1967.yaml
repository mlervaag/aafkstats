id: jarle-kristoffersen-formann-1967
status: resolved
category: role
claim: Jarle Kristoffersen var formann i AaFK i 1967.
question: Var Jarle Kristoffersen formann i AaFK i 1967?
context: Et maskinelt treff i et medlemsblad peker på Jarle Kristoffersen, mens lederoversiktene fører Erling Bjørge.
whyItMatters: En fortellende omtale kan ha blitt tolket som en årsrad.
yesMeaning: En kilde identifiserer Jarle Kristoffersen som klubbformann i 1967.
noMeaning: En kilde identifiserer Erling Bjørge eller en annen person som klubbformann.
instructions: ["Les teksten rundt navnet, ikke bare søkeresultatet.", "Kontroller om det gjelder hovedstyret eller et underorgan."]
target: { type: person, id: jarle-kristoffersen, field: formann.1967 }
sources:
  - { sourceId: medlemsblad-for-aalesunds-fotb-1974-ab1b, page: "3", role: supports, note: Maskinelt treff. }
  - { sourceId: tango-siden-1914-2013-806b, page: "348", role: contradicts, note: Lederoversikt. }
