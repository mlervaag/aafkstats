id: nils-jangaard-oppmann-1917
status: resolved
category: role
claim: Nils Jangaard var oppmann i AaFK i 1917.
question: Var Nils Jangaard oppmann i AaFK i 1917?
context: OCR fra 80-årsboka peker på Nils Jangaard, mens 1939-boka og andre tabeller peker på Harald Riise-Hansen.
whyItMatters: Fulltekstkontekst og tabellavlesning har koblet samme verv til to personer.
yesMeaning: En kilde fører Nils Jangaard som oppmann i 1917.
noMeaning: En kilde fører Harald Riise-Hansen eller en annen person som oppmann i 1917.
instructions: ["Kontroller riktig kolonne og år.", "Se etter navneformen Riise Hansen uten bindestrek."]
target: { type: person, id: nils-jangaard, field: oppmann.1917 }
sources:
  - { sourceId: vi-er-80-ar-1914-1994-1994-5e91, page: "7", role: supports, note: Avvikende OCR-avlesning. Feilkobling skyldes spalteforveksling — ikke en reell kildepåstand. }
  - { sourceId: aalesunds-fotballklub-gjennem-1939-ec28, page: "18", role: contradicts, note: Nær samtidig liste. Manuelt kontrollert. }
  - { sourceId: vi-er-75-ar-1989-aff6, page: "8", role: contradicts, note: Manuelt kontrollert tabell. }
  - { sourceId: aalesunds-fotballklubb-90-ar-1-2004-ad1d, page: "27", role: contradicts, note: Manuelt kontrollert tabell. Fører Harald Riise-Hansen som oppmann i 1917. }
estimatedMinutes: 6
priority: 91
publishedAt: 2026-08-13
resolution:
  answer: no
  reason: >
    1939-boka (aalesunds-fotballklub-gjennem-1939-ec28 s. 18) er den klart tidligste og
    sterkeste dokumentasjonen, og fører Harald Riise-Hansen som oppmann i 1917. De senere
    jubileumsbøkene samsvarer med den: vi-er-75-ar-1989-aff6 s. 8 og
    aalesunds-fotballklubb-90-ar-1-2004-ad1d s. 27. Alle tre er manuelt kontrollert.
    Innsenderen bekrefter dette ved manuell lesning av vi-er-80-ar-1914-1994-1994-5e91 s. 7,
    som også fører Harald. Den maskinelle koblingen til Nils Jangaard skyldes at
    name_then_year-regelen feilaktig tolket Nils Jangaard (formann) som oppmann fordi han står
    øverst i tabellraden for 1917. Nils Jangaard var formann, ikke oppmann, i 1917. Den falske
    kildepåstanden er derfor fjernet, ikke ført som en løst konflikt.
  resolvedAt: "2026-08-18"
