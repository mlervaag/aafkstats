publishedAt: 2026-08-13
resolution:
  answer: no
  reason: Manuell kontroll av 50-årsboka side 81, 1939-boka side 18, 75-årsboka side 8 og 90-årsboka side 27 viser at Georg Haller var formann i 1914–1915. Ole Jangaard står som oppmann i 1915, 1918, 1919, 1923 og 1924. Formannspåstanden skyldtes en kolonneforveksling i det maskinelle uttrekket.
  resolvedAt: 2026-08-13
