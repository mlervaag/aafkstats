claim: Ole Jangaard var formann i AaFK i 1915.
question: Var Ole Jangaard formann i AaFK i 1915?
context: Et maskinelt uttrekk pekte på Ole Jangaard. Flere manuelt kontrollerte kilder fører Georg Haller som formann og Ole Jangaard som oppmann.
whyItMatters: Uttrekket kan ha forvekslet kolonnene for klubbens to første nøkkelroller.
yesMeaning: En kilde identifiserer Ole Jangaard som klubbformann i 1915.
noMeaning: En kilde identifiserer Georg Haller som formann og Ole Jangaard i et annet verv.
instructions: ["Kontroller hele tabellraden for 1915.", "Skill formann fra oppmann."]
target: { type: person, id: ole-jangaard, field: formann.1915 }
sources:
  - { sourceId: aalesunds-fotballklubb-1914-50-1964-3815, page: "81", role: contradicts, note: Tabellen fører Georg Haller som formann i 1914–1915 og Ole Jangaard som oppmann i 1915. }
  - { sourceId: aalesunds-fotballklub-gjennem-1939-ec28, page: "18", role: contradicts, note: Første formanns- og oppmannsliste. }
  - { sourceId: vi-er-75-ar-1989-aff6, page: "8", role: contradicts, note: Manuelt kontrollert tabell. }
  - { sourceId: aalesunds-fotballklubb-90-ar-1-2004-ad1d, page: "27", role: contradicts, note: Manuelt kontrollert tabell. }
