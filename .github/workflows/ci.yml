name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobben leser bare koden. Uten dette arver den standardrettighetene til
# repoet, og en kompromittert avhengighet i pnpm-treet ville hatt tokenet
# som skal til for å skrive tilbake hit.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Ingen databasetjeneste. Arkivet er en SQLite-fil som bygges fra data/ på
    # millisekunder, og testene bygger sin egen fixture-fil i beforeAll. Dermed
    # kjører alt likt her og lokalt — ingen tester som «hoppes over uten database».
    steps:
      # Full SHA hindrer at en flyttbar tag kan bytte ut koden CI kjører.
      # fetch-depth: 0 sikrer at git-historikk er tilgjengelig for historisk bevaringsanalyse mot base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Arkivet må validere før noe annet. Feiler dette, er dataene ødelagte og
      # resten av jobben sier ingenting nyttig.
      - name: Valider arkivet
        run: pnpm validate

      - name: Valider fixture-arkivet
        run: AAFK_DATA_DIR=fixtures/data pnpm validate

      # Kontrollerer at ingen eksisterende personhistorikk, roller, kilder eller
      # konflikter har forsvunnet utilsiktet (preservation guardrail).
      - name: Kontroller historisk additivitet
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm data:historical-preservation --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
          else
            pnpm data:historical-preservation
          fi

      # En PR som endrer kildedata må ha et batchmanifest. Uten dette steget er
      # hele innhøstingsarbeidsflyten frivillig: den som ikke oppretter et
      # manifest slipper unna samtlige kontroller under.
      - name: Krev batchmanifest for kildeendringer
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- data/sources data/source-results data/extractions)
          if [ -z "$CHANGED" ]; then
            echo "Ingen endringer i kildedata — manifest ikke påkrevd."
            exit 0
          fi
          echo "Endret kildedata:"
          echo "$CHANGED"
          MANIFESTS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- data/harvests)
          if [ -z "$MANIFESTS" ]; then
            echo "::error::PR-en endrer kildedata uten å opprette eller oppdatere et batchmanifest i data/harvests/."
            echo "Kjør «pnpm data:historical-harvest:init» og dokumenter innhøstingen."
            exit 1
          fi
          echo "Manifest funnet:"
          echo "$MANIFESTS"

      # Kontrollerer at eventuelle innhøstingsbatcher i data/harvests/ validerer og
      # at fullførte batcher oppfyller samtlige krav.
      - name: Kontroller historiske innhøstingsbatcher
        run: |
          if [ -d "data/harvests" ] && compgen -G "data/harvests/*.yaml" > /dev/null; then
            for f in data/harvests/*.yaml; do
              echo "Sjekker innhøstingsbatch: $f"
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                pnpm data:historical-harvest:check --file "$f" --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
              else
                pnpm data:historical-harvest:check --file "$f"
              fi
            done
          fi

      # Rapporterer, feller ikke bygget. Nesten like klubbnavn kan være samme
      # klubb eller to naboklubber, og bare et menneske kan avgjøre hvilket.
      # Det maskinen er sikker på, feiler pnpm validate allerede på.
      - name: Rapporter mistenkelige dubletter
        run: pnpm data:duplicates

      # Rapporterer, feller ikke bygget. Et stort siffer kan være et ekte
      # storspill eller en feil hos kilden, og bare et menneske kan avgjøre.
      - name: Rapporter tvilsomme resultater
        run: pnpm data:uncertain

      - name: Typesjekk
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Kjør tester
        run: pnpm test

      # Bygger med fixture-data, ikke data/. Da rendres sidene med kamper i seg —
      # med et tomt data/ ville byggesteget vært grønt uten å ha vist noe.
      - name: Bygg nettstedet
        run: AAFK_DATA_DIR=fixtures/data pnpm build

      # Leser HTML-en bygget faktisk produserte. Fanger det enhetstestene ikke
      # ser: en side som kaster under prerendering, en tom seksjon på en kamp
      # som ikke er spilt, eller en tittel som falt tilbake til prosjektnavnet.
      - name: Røyketest av de ferdige sidene
        run: pnpm smoke
