name: Manglende kamp
description: En kamp som mangler helt i arkivet
title: "Manglende kamp: "
labels: ["data", "manglende kamp"]
body:
  - type: markdown
    attributes:
      value: |
        Arkivet er fullt av hull, særlig før 1990 og i cupen. Vet du om en kamp som mangler,
        er dette stedet. Bare dato og motstander holder — resten kan fylles inn senere.

  - type: input
    id: dato
    attributes:
      label: Dato
      description: Kjenner du bare måneden eller året, skriv det du vet.
      placeholder: 15.06.1930, eller «juni 1930»
    validations:
      required: true

  - type: input
    id: motstander
    attributes:
      label: Motstander
      description: >
        Er klubben ny for arkivet, er det helt greit — den legges inn samtidig. Finnes den
        kanskje under et annet navn fra den tida, si det.
      placeholder: SK Brann
    validations:
      required: true

  - type: dropdown
    id: hjemmebane
    attributes:
      label: Hjemme eller borte
      description: >
        Avgjør rekkefølgen på lagene i kamp-ID-en, og dermed filnavnet. Er du usikker, si det
        heller enn å gjette.
      options:
        - Hjemme for AaFK
        - Borte
        - Nøytral bane
        - Vet ikke
    validations:
      required: true

  - type: dropdown
    id: konkurranse
    attributes:
      label: Konkurranse
      options:
        - Serie
        - Cup (NM)
        - Europacup
        - Kvalifisering eller playoff
        - Treningskamp
        - Vet ikke
    validations:
      required: true

  - type: input
    id: resultat
    attributes:
      label: Resultat
      description: >
        Skriv AaFK sitt mål først, uansett hvem som var hjemmelag — feltet over sier hvilken
        vei det skal snus. La stå tomt hvis du er usikker.
      placeholder: 1–3

  - type: textarea
    id: annet
    attributes:
      label: Annet du vet
      description: Bane, tilskuertall, målscorere, dommer, runde — alt er nyttig.

  - type: textarea
    id: kilde
    attributes:
      label: Hvor vet du det fra?
      description: Lenke, avis med dato, kampprogram, bok, eget arkiv.
    validations:
      required: true

  - type: checkboxes
    id: bekreft
    attributes:
      label: Før du sender
      options:
        - label: >
            Jeg har lett etter kampen på aafkstats.vercel.app. Står den der med feil dato
            eller feil motstander, hører den hjemme i «Feil i arkivet» i stedet.
          required: false
