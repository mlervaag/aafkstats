name: Feil i koden eller på nettstedet
description: Noe krasjer, ser rart ut eller oppfører seg feil
title: "Feil: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gjelder det et sikkerhetsproblem, skal det ikke meldes her — se
        [SECURITY.md](../blob/main/SECURITY.md).

        Er tallet på siden galt, men siden ellers virker som den skal, er det ikke en kodefeil
        — da hører det hjemme i [Feil i arkivet](?template=datafeil.yml).

  - type: dropdown
    id: omrade
    attributes:
      label: Hvor er feilen?
      options:
        - Nettstedet — en side, en tabell, søket
        - Spørrefunksjonen — svaret fra AI-en
        - En pnpm-kommando lokalt (validate, db:build, test)
        - API-et
        - Vet ikke
    validations:
      required: true

  - type: textarea
    id: hva
    attributes:
      label: Hva skjer?
      description: >
        Hva gjorde du, hva forventet du, og hva skjedde i stedet? Gjelder det spørrefunksjonen,
        lim inn spørsmålet ditt ordrett og svaret du fikk — formuleringen er halve feilen.
      placeholder: |
        Søkte på «molde 2019» i hovedfeltet. Fikk ingen treff, men kampen finnes.
    validations:
      required: true

  - type: textarea
    id: reproduksjon
    attributes:
      label: Slik reproduseres det
      placeholder: |
        1. Åpne aafkstats.vercel.app
        2. Skriv «molde 2019» i søkefeltet
        3. Ingen treff vises
    validations:
      required: true

  - type: input
    id: hvor
    attributes:
      label: Hvor
      description: URL på nettstedet, eller kommandoen du kjørte lokalt.
      placeholder: https://aafkstats.vercel.app/sesong/2019

  - type: input
    id: miljo
    attributes:
      label: Nettleser eller Node-versjon
      placeholder: Safari 18 på iPhone / Node 22.11 på macOS

  - type: textarea
    id: logg
    attributes:
      label: Feilmelding eller logg
      description: Lim inn hele meldingen hvis du har en. Den formateres automatisk som kode.
      render: text
