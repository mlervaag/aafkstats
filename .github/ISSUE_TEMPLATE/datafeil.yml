name: Feil i arkivet
description: Feil kampdata, person, rolle, hjemmebane, kilde eller annen arkivopplysning
title: "Datafeil: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Takk for at du melder fra. Feil i arkivet er ikke pinlige — de er grunnen til at
        dataene ligger i git. Kan du rette det selv, er det én YAML-fil å endre og én pull
        request å sende; se [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).

        To ting hører hjemme et annet sted: skal du *legge til* noe på en kamp som ellers
        står riktig, bruk [Ny kilde eller flere kampdetaljer](?template=ny-kilde.yml). Gjelder
        det en klubb som finnes to ganger, har byttet navn eller er feil motstander, bruk
        [Klubbidentitet eller historisk navn](?template=klubbidentitet.yml) — den rettelsen
        treffer alle kampene på én gang.

  - type: input
    id: sted
    attributes:
      label: Hva i arkivet gjelder feilen?
      description: Navn, dato eller tittel, og gjerne lenken til siden.
      placeholder: Georg Haller — /personer/georg-haller
    validations:
      required: true

  - type: textarea
    id: feil
    attributes:
      label: Hva står det nå, og hva skal det stå?
      placeholder: |
        Arkivet sier at personen var formann i 1919. Kilden oppgir 1915.
    validations:
      required: true

  - type: textarea
    id: kilde
    attributes:
      label: Hvor vet du det fra?
      description: >
        Lenke, avis med dato, kampprogram, eget arkiv — hva som helst som gjør det mulig å
        etterprøve. Uten kilde blir rettelsen stående som påstand mot påstand.
    validations:
      required: true

  - type: dropdown
    id: uenighet
    attributes:
      label: Er dette en feil, eller en uenighet?
      description: >
        Arkivsiden viser hvilken kilde opplysningen kommer fra. Sier den kilden fortsatt
        noe annet enn din, er det ikke nødvendigvis feil — da har arkivet to kilder som ikke
        er enige, og det er en opplysning i seg selv. Arkivet fører den som `conflicts` i
        stedet for å velge i stillhet.
      options:
        - Arkivet tar rett og slett feil
        - Kilden min sier noe annet enn arkivets, og begge kan være verdt å føre
        - Vet ikke
    validations:
      required: true

  - type: checkboxes
    id: bekreft
    attributes:
      label: Før du sender
      options:
        - label: Jeg har sjekket at feilen fortsatt finnes i arkivet
          required: false
